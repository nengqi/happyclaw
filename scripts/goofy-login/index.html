<h1>happyclaw · bytedcli 身份授权</h1>
<p>在飞书里对机器人发 <code>/login</code>，会拿到一行带你专属 nonce 的命令，形如：</p>
<pre>curl -fsSL https://bytedcli-login.gf-preview.bytedance.net/login.sh | bash -s -- &lt;nonce&gt;</pre>
<p>在你<strong>本机终端</strong>粘贴运行：脚本会用你本人身份登录 bytedcli、自助创建 codebase
PAT、并把凭证<strong>自动回传</strong>给 happyclaw。全程密钥不进飞书对话。</p>
<p class="note">脚本源码：<code>scripts/goofy-login/login.sh</code>。仅办公网可访问。</p>
